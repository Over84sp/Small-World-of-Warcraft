<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173049"/>
      <stop offset="1" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9de0"/>
      <stop offset="1" stop-color="#22558f"/>
    </linearGradient>
    <linearGradient id="axe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2683f"/>
      <stop offset="1" stop-color="#8e2d16"/>
    </linearGradient>
  </defs>

  <!-- opaque background: iOS masks the corners itself -->
  <rect width="512" height="512" fill="url(#sea)"/>

  <!-- hex tiles, the board seen from far away -->
  <g opacity="0.5">
    <path d="M256 34 L346 86 V190 L256 242 L166 190 V86 Z" fill="#2f6d4a"/>
    <path d="M104 122 L194 174 V278 L104 330 L14 278 V174 Z" fill="#7d6a3c"/>
    <path d="M408 122 L498 174 V278 L408 330 L318 278 V174 Z" fill="#6d4433"/>
    <path d="M256 210 L346 262 V366 L256 418 L166 366 V262 Z" fill="#3b5f78"/>
    <path d="M104 298 L194 350 V454 L104 506 L14 454 V350 Z" fill="#4d6b3a"/>
    <path d="M408 298 L498 350 V454 L408 506 L318 454 V350 Z" fill="#6a6f79"/>
    <g fill="none" stroke="#0d1a26" stroke-width="7" stroke-linejoin="round">
      <path d="M256 34 L346 86 V190 L256 242 L166 190 V86 Z"/>
      <path d="M104 122 L194 174 V278 L104 330 L14 278 V174 Z"/>
      <path d="M408 122 L498 174 V278 L408 330 L318 278 V174 Z"/>
      <path d="M256 210 L346 262 V366 L256 418 L166 366 V262 Z"/>
      <path d="M104 298 L194 350 V454 L104 506 L14 454 V350 Z"/>
      <path d="M408 298 L498 350 V454 L408 506 L318 454 V350 Z"/>
    </g>
  </g>

  <!-- vignette so the centre pops -->
  <rect width="512" height="512" fill="#08111a" opacity="0.28"/>

  <!-- the two banners, facing off -->
  <g transform="translate(256 262)">
    <!-- Horde axe, right: full double bladed head so it reads at 60px -->
    <g transform="translate(80 2) scale(7.2)">
      <rect x="-1" y="-11" width="2" height="24" rx="1" fill="#6b4326" stroke="#2a0d06" stroke-width="0.7"/>
      <g fill="url(#axe)" stroke="#2a0d06" stroke-width="0.9" stroke-linejoin="round">
        <path d="M1 -9 C6 -8 9.6 -3.6 10 2.2 C10.3 6.2 8.2 9 4.6 10 L3.4 6.2
                 C5.6 5.4 6.5 3.6 6.2 1.2 C5.8 -2.2 3.8 -4.4 1 -5.2 Z"/>
        <path d="M-1 -9 C-6 -8 -9.6 -3.6 -10 2.2 C-10.3 6.2 -8.2 9 -4.6 10 L-3.4 6.2
                 C-5.6 5.4 -6.5 3.6 -6.2 1.2 C-5.8 -2.2 -3.8 -4.4 -1 -5.2 Z"/>
      </g>
    </g>
    <!-- Alliance shield, left -->
    <g transform="translate(-80 0) scale(7.2)">
      <path d="M0 -11 L9.4 -7 V2 C9.4 9 4.8 14 0 16 C-4.8 14 -9.4 9 -9.4 2 V-7 Z"
        fill="url(#shield)" stroke="#0c2340" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M0 -6.6 L2 -1.9 L7 -1.4 L3.4 2.2 L4.3 7.2 L0 4.8 L-4.3 7.2 L-3.4 2.2 L-7 -1.4 L-2 -1.9 Z"
        fill="#dbeaff"/>
    </g>
  </g>

  <!-- gold rim, like a coin -->
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#d8ab4e" stroke-width="14" opacity="0.85"/>
</svg>
